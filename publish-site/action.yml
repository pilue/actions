name: Publish site
description: Send an HMAC-signed publish request to platform-api

inputs:
  domain:
    description: Registered domain, e.g. matthewsbirdtables.pilue.co.uk
    required: true
  repo:
    description: HTTPS clone URL of the source repo
    required: true
  ref:
    description: Git ref to build (branch/tag/SHA)
    required: true
  preview:
    description: true for preview deploy, false for production deploy
    required: true
  pr_number:
    description: PR number for preview comments (optional)
    required: false
    default: ""
  hmac_secret:
    description: Shared HMAC secret for this domain
    required: true
  source_token:
    description: Token for cloning private source repo (optional)
    required: false
    default: ""
  notification_token:
    description: Token for PR/release comments in source repo (optional)
    required: false
    default: ""
  source_sha:
    description: HEAD SHA of the source repo commit being built (used in image tag)
    required: false
    default: ""
  teardown:
    description: true to tear down a preview deployment (skips build)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Send publish request
      id: publish
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        PREVIEW: ${{ inputs.preview }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        SOURCE_TOKEN: ${{ inputs.source_token }}
        NOTIFICATION_TOKEN: ${{ inputs.notification_token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TEARDOWN: ${{ inputs.teardown }}
      run: |
        set -euo pipefail

        PAYLOAD=$(python3 - <<'PYEOF'
        import json
        import os

        d = {
            "domain": os.environ["DOMAIN"],
            "repo": os.environ["REPO"],
            "ref": os.environ["REF"],
            "preview": os.environ.get("PREVIEW", "false").lower() == "true",
        }

        pr = os.environ.get("PR_NUMBER", "").strip()
        if pr:
            d["pr_number"] = pr

        source_token = os.environ.get("SOURCE_TOKEN", "").strip()
        if source_token:
            d["source_token"] = source_token

        notification_token = os.environ.get("NOTIFICATION_TOKEN", "").strip()
        if notification_token:
            d["notification_token"] = notification_token

        source_sha = os.environ.get("SOURCE_SHA", "").strip()
        if source_sha:
            d["source_sha"] = source_sha

        if os.environ.get("TEARDOWN", "false").lower() == "true":
            d["teardown"] = True

        print(json.dumps(d))
        PYEOF
        )

        SIG="sha256=$(printf '%s' "${PAYLOAD}" | openssl dgst -sha256 -hmac "${HMAC_SECRET}" | awk '{print $2}')"

        HTTP_STATUS=$(curl -s -o /tmp/platform_api_response.txt -w "%{http_code}" \
          -X POST "https://api.davidcloud.co.uk/publish" \
          -H "Content-Type: application/json" \
          -H "Accept: application/json" \
          -H "User-Agent: GitHub-Actions/pilue-publish-site" \
          -H "X-Publish-Token: ${HMAC_SECRET}" \
          -H "X-Hub-Signature-256: ${SIG}" \
          -d "${PAYLOAD}")

        echo "platform-api response (HTTP ${HTTP_STATUS}):"
        cat /tmp/platform_api_response.txt

        if [[ "${HTTP_STATUS}" != "202" ]]; then
          if grep -qi "Just a moment" /tmp/platform_api_response.txt; then
            echo "Cloudflare challenge blocked the request before it reached platform-api."
            echo "Create a Cloudflare WAF skip rule for host api.davidcloud.co.uk and path /publish."
            echo "HMAC validation in platform-api still protects the endpoint."
          fi
          echo "Publish request failed with HTTP ${HTTP_STATUS}"
          exit 1
        fi

        DISPATCH_TIME=$(python3 -c "import json,sys; print(json.load(open('/tmp/platform_api_response.txt')).get('dispatch_time',''))" 2>/dev/null || true)
        echo "dispatch_time=${DISPATCH_TIME}" >> "$GITHUB_OUTPUT"

    - name: Wait for deployment to complete
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        DISPATCH_TIME: ${{ steps.publish.outputs.dispatch_time }}
      run: |
        set -euo pipefail

        if [[ -z "${DISPATCH_TIME}" ]]; then
          echo "No dispatch_time in response — skipping wait."
          exit 0
        fi

        STATUS_URL="https://api.davidcloud.co.uk/status?domain=${DOMAIN}&since=${DISPATCH_TIME}"
        POLL_INTERVAL=15
        MAX_WAIT=1200  # 20 minutes
        elapsed=0

        echo "Waiting for deployment of ${DOMAIN} to complete..."
        echo "Polling: ${STATUS_URL}"

        while true; do
          HTTP_STATUS=$(curl -s -o /tmp/status_response.txt -w "%{http_code}" "${STATUS_URL}" || true)
          BODY=$(cat /tmp/status_response.txt)

          STATUS=$(python3 -c "import json,sys; print(json.loads('${BODY}').get('status','unknown'))" 2>/dev/null || echo "unknown")
          CONCLUSION=$(python3 -c "import json,sys; v=json.loads('${BODY}').get('conclusion'); print(v if v else '')" 2>/dev/null || true)
          RUN_URL=$(python3 -c "import json,sys; v=json.loads('${BODY}').get('run_url'); print(v if v else '')" 2>/dev/null || true)

          if [[ -n "${RUN_URL}" ]]; then
            echo "Workflow run: ${RUN_URL}"
          fi

          case "${STATUS}" in
            completed)
              echo "Deployment ${CONCLUSION:-unknown}."
              if [[ "${CONCLUSION}" != "success" ]]; then
                echo "Workflow did not succeed (conclusion: ${CONCLUSION}). See run for details."
                exit 1
              fi
              echo "Deployment of ${DOMAIN} succeeded."
              exit 0
              ;;
            in_progress)
              echo "  [${elapsed}s] Build/deploy in progress..."
              ;;
            queued)
              echo "  [${elapsed}s] Workflow queued, waiting to start..."
              ;;
            *)
              echo "  [${elapsed}s] Waiting for workflow run to appear... (status: ${STATUS})"
              ;;
          esac

          if [[ "${elapsed}" -ge "${MAX_WAIT}" ]]; then
            echo "Timed out after ${MAX_WAIT}s waiting for deployment to complete."
            exit 1
          fi

          sleep "${POLL_INTERVAL}"
          elapsed=$((elapsed + POLL_INTERVAL))
        done
