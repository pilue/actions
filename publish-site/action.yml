name: Publish site
description: Send an HMAC-signed publish request to platform-api

inputs:
  domain:
    description: Registered domain, e.g. site.example.co.uk
    required: true
  repo:
    description: HTTPS clone URL of the source repo. Auto-detected from the GitHub context if not set.
    required: false
    default: ""
  preview:
    description: true for preview deploy, false for production deploy
    required: true
  hmac_secret:
    description: Shared HMAC secret for this domain
    required: true
  ref:
    description: Git ref to build (branch/tag/SHA). Defaults to the PR head branch on pull_request events, or the branch/tag name on push events.
    required: false
    default: ""
  pr_number:
    description: PR number for preview comments. Auto-detected on pull_request events.
    required: false
    default: ""
  source_sha:
    description: HEAD SHA of the source repo commit being built (used in image tag). Auto-detected from the current commit or PR head.
    required: false
    default: ""
  source_token:
    description: Token for cloning private source repo (optional)
    required: false
    default: ""
  notification_token:
    description: Token for PR/release comments in source repo. Defaults to source_token if not set.
    required: false
    default: ""
  teardown:
    description: true to tear down a preview deployment (skips build)
    required: false
    default: "false"
  log_tail_lines:
    description: Number of log lines to request from the API for failed deployments.
    required: false
    default: "50"

runs:
  using: composite
  steps:
    - name: Send publish request
      id: publish
      shell: bash
      env:
        DOMAIN: ${{ inputs.domain }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        PREVIEW: ${{ inputs.preview }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        SOURCE_TOKEN: ${{ inputs.source_token }}
        NOTIFICATION_TOKEN: ${{ inputs.notification_token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        TEARDOWN: ${{ inputs.teardown }}
      run: python3 ${{ github.action_path }}/scripts/send_publish.py

    - name: Wait for deployment to complete
      shell: bash
      env:
        PYTHONUNBUFFERED: "1"
        DOMAIN: ${{ inputs.domain }}
        DISPATCH_TIME: ${{ steps.publish.outputs.dispatch_time }}
        HMAC_SECRET: ${{ inputs.hmac_secret }}
        LOG_TAIL_LINES: ${{ inputs.log_tail_lines }}
      run: python3 ${{ github.action_path }}/scripts/poll_status.py
